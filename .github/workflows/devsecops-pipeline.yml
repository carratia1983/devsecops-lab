name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # 1. SECRET SCANNING
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --error app/

  # 3. SCA
  sca:
    name: 3. SCA (Trivy FS)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # 4. IaC
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: false

  # 5. BUILD + SCAN + PUSH + SBOM
  build-and-sbom:
    name: 5. Build, Scan, Push & SBOM
    needs: [sast, sca, iac-security]
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha

      # BUILD LOCAL
      - name: Build imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # SBOM
      - name: Generar SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Subir SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # SCAN (NO BLOQUEA)
      - name: Trivy Image Scan
        continue-on-error: true   # 🔥 CLAVE
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # PUSH SIEMPRE
      - name: Push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # 6. FIRMA CON COSIGN
  sign-container:
    name: 6. Firma (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ASEGURA QUE LA IMAGEN EXISTE
      - name: Pull imagen
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          docker pull $IMAGE_REF

      # OPCIÓN PRO: USAR DIGEST
      - name: Obtener digest
        id: digest
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_REF)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Firmar imagen
        run: |
          cosign sign --yes "${{ steps.digest.outputs.digest }}"